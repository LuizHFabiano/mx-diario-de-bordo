<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Bordo — MX Soluções</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --color-bg: #F6F6F3;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B1A;
  --color-ink-soft: #514F4C;
  --color-muted: #8C8985;
  --color-border: #E7E4DF;
  --color-border-strong: #D8D4CD;
  --color-accent: #F2A73B;
  --color-accent-dark: #C9821B;
  --color-accent-soft: #FCECCB;
  --color-now: #E5484D;
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  --sidebar-w: 252px;
  --hour-h: 64px;
  --label-col-w: 56px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 18px;
  --shadow-modal: 0 24px 60px -16px rgba(28,27,26,0.38);
  --shadow-card: 0 1px 2px rgba(28,27,26,0.06);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--color-ink);
  background:var(--color-bg);
  -webkit-font-smoothing:antialiased;
}
button, input, textarea{ font-family:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--color-accent-dark); outline-offset:2px; }

.auth-screen{
  position:fixed; inset:0;
  background:var(--color-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:300;
}
.auth-card{
  width:100%;
  max-width:380px;
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:32px 28px;
}
.auth-tabs{
  display:flex;
  gap:4px;
  background:#F2F1EE;
  border-radius:var(--radius-sm);
  padding:4px;
  margin:22px 0 20px;
}
.auth-tab{
  flex:1;
  padding:8px;
  border:none;
  background:transparent;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  color:var(--color-ink-soft);
}
.auth-tab.is-active{
  background:var(--color-surface);
  color:var(--color-ink);
  box-shadow:var(--shadow-card);
}

.app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--color-surface);
  border-right:1px solid var(--color-border);
  border-left:4px solid var(--color-accent);
  display:flex;
  flex-direction:column;
  padding:28px 18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 6px 32px;
}
.brand__mark{
  width:36px; height:36px;
  border-radius:9px;
  background:var(--color-ink);
  position:relative;
  flex-shrink:0;
  overflow:hidden;
}
.brand__mark::before, .brand__mark::after{
  content:"";
  position:absolute;
  width:3px;
  height:26px;
  top:5px;
  background:var(--color-accent);
}
.brand__mark::before{ left:11px; transform:rotate(22deg); }
.brand__mark::after{ left:21px; transform:rotate(-22deg); }
.brand__text{ line-height:1.05; }
.brand__text strong{
  display:block;
  font-family:var(--font-display);
  font-size:16px;
  font-weight:700;
  letter-spacing:0.01em;
}
.brand__text span{
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  color:var(--color-muted);
}

.nav{ display:flex; flex-direction:column; gap:4px; }
.nav__item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:10px 12px;
  border:none;
  background:transparent;
  border-radius:var(--radius-sm);
  color:var(--color-ink-soft);
  font-size:14px;
  font-weight:500;
  text-align:left;
  transition:background .15s ease, color .15s ease;
}
.nav__item img{ width:17px; height:17px; flex-shrink:0; opacity:.8; }
.nav__item:hover{ background:#F2F1EE; }
.nav__item.is-active{ background:var(--color-ink); color:#fff; }
.nav__item.is-active img{ opacity:1; filter:brightness(0) invert(1); }
.sidebar__footer{ margin-top:auto; padding-top:20px; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; }
.main__header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:26px 40px;
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface);
  flex-wrap:wrap;
}
.main__title{
  font-family:var(--font-display);
  font-size:21px;
  font-weight:600;
  text-transform:capitalize;
}
.main__subtitle{
  margin-top:2px;
  font-size:12.5px;
  color:var(--color-muted);
  font-family:var(--font-mono);
}
.header__actions{ display:flex; gap:10px; flex-wrap:wrap; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  font-weight:600;
  border:1px solid transparent;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.btn img{ width:14px; height:14px; display:block; }
.btn:active{ transform:translateY(1px); }
.btn--primary{ background:var(--color-ink); color:#fff; }
.btn--primary:hover{ background:#000; }
.btn--accent{ background:var(--color-accent); color:#2B1B02; }
.btn--accent:hover{ background:var(--color-accent-dark); color:#fff; }
.btn--ghost{ background:transparent; border-color:var(--color-border-strong); color:var(--color-ink-soft); }
.btn--ghost:hover{ border-color:var(--color-ink-soft); color:var(--color-ink); }
.btn--full{ width:100%; justify-content:center; }
.btn--danger{ background:transparent; border-color:#F3C4C3; color:#B23A38; }
.btn--danger:hover{ background:#FDECEC; }

.content-wrapper{ flex:1; overflow-y:auto; padding:28px 40px 60px; }
.timeline-shell{
  max-width:920px;
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:24px 28px 28px;
}
.locked-banner{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--color-accent-soft);
  color:#7A4E0E;
  border:1px solid #F0D8A6;
  border-radius:var(--radius-sm);
  padding:10px 14px;
  font-size:12.5px;
  font-weight:600;
  margin-bottom:18px;
}
.locked-banner img{ width:14px; height:14px; }

.timeline-grid{
  position:relative;
  margin-left:var(--label-col-w);
  border-left:1px solid var(--color-border-strong);
}
.hour-row{
  position:relative;
  height:var(--hour-h);
  border-bottom:1px solid var(--color-border);
}
.hour-row:last-child{ border-bottom:1px solid var(--color-border-strong); }
.hour-row__label{
  position:absolute;
  left:calc(-1 * var(--label-col-w) - 10px);
  top:0;
  transform:translateY(-50%);
  width:var(--label-col-w);
  text-align:right;
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--color-muted);
}
.events-layer{ position:absolute; inset:0; pointer-events:none; }
.now-line{
  position:absolute;
  left:0; right:0;
  height:0;
  border-top:2px solid var(--color-now);
  z-index:5;
  display:none;
}
.now-line::before{
  content:"";
  position:absolute;
  left:-5px; top:-4px;
  width:8px; height:8px;
  border-radius:50%;
  background:var(--color-now);
}
.event-block{
  position:absolute;
  pointer-events:auto;
  border-radius:8px;
  border-left:3px solid var(--ev-line);
  background:var(--ev-bg);
  padding:6px 10px 6px 9px;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(28,27,26,0.08);
  transition:box-shadow .15s ease;
}
.event-block.is-editable{ cursor:pointer; }
.event-block.is-editable:hover{ box-shadow:0 4px 14px -4px rgba(28,27,26,0.28); z-index:20; }
.event-block__time{ font-family:var(--font-mono); font-size:10.5px; color:var(--ev-line); font-weight:600; }
.event-block__title{
  font-size:12.5px;
  font-weight:600;
  color:var(--color-ink);
  margin:1px 0 2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.event-block__desc{
  font-size:11.5px;
  color:var(--color-ink-soft);
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.event-block__delete{
  position:absolute;
  top:4px; right:4px;
  width:18px; height:18px;
  border:none;
  background:rgba(255,255,255,0.75);
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
}
.event-block__delete img{ width:9px; height:9px; }
.event-block.is-editable:hover .event-block__delete{ display:flex; }
.event-block__lock{ position:absolute; top:5px; right:5px; }
.event-block__lock img{ width:11px; height:11px; opacity:.55; }

.empty-state{
  margin-left:calc(var(--label-col-w) + 16px);
  padding:14px 0;
  font-size:12.5px;
  color:var(--color-muted);
}
.placeholder{
  max-width:920px;
  background:var(--color-surface);
  border:1px dashed var(--color-border-strong);
  border-radius:var(--radius-lg);
  padding:60px 28px;
  text-align:center;
  color:var(--color-muted);
  font-size:13.5px;
}

.day-list{ display:flex; flex-direction:column; gap:8px; max-width:560px; }
.day-list__item{
  text-align:left;
  padding:14px 16px;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  background:var(--color-surface);
  font-size:13.5px;
  font-weight:500;
  color:var(--color-ink);
  text-transform:capitalize;
}
.day-list__item:hover{ border-color:var(--color-accent-dark); }

.config-grid{ display:flex; flex-direction:column; gap:20px; max-width:480px; }
.config-card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  padding:22px 24px;
}
.config-card h3{ margin:0 0 4px; font-family:var(--font-display); font-size:14.5px; }
.config-card p.hint{ margin:0 0 16px; font-size:12px; color:var(--color-muted); }
.config-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
.clock-readout{ font-family:var(--font-mono); font-size:13px; color:var(--color-ink-soft); margin:2px 0 16px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--color-ink-soft); margin-bottom:6px; }
.field input, .field textarea{
  width:100%;
  padding:9px 11px;
  border:1px solid var(--color-border-strong);
  border-radius:var(--radius-sm);
  font-size:13.5px;
  color:var(--color-ink);
  background:#FCFCFB;
}
.field input:focus, .field textarea:focus{ border-color:var(--color-accent-dark); background:#fff; }
.field textarea{ resize:vertical; min-height:72px; font-family:var(--font-body); }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; }
.field__error{ font-size:11.5px; color:var(--color-now); margin-top:5px; display:none; }
.field__error.is-visible{ display:block; }

.modal-overlay{
  position:fixed; inset:0;
  background:rgba(28,27,26,0.42);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .15s ease;
  z-index:100;
  padding:20px;
}
.modal-overlay.is-open{ opacity:1; visibility:visible; }
.modal{
  width:100%;
  max-width:440px;
  background:var(--color-surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-modal);
  padding:26px 26px 22px;
  transform:translateY(8px);
  transition:transform .15s ease;
}
.modal-overlay.is-open .modal{ transform:translateY(0); }
.modal__title{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:0 0 18px; }
.modal__actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

@media (max-width: 760px){
  .sidebar{ width:72px; padding:20px 12px; }
  .brand__text, .nav__item span{ display:none; }
  .brand{ justify-content:center; padding-bottom:24px; }
  .nav__item{ justify-content:center; padding:12px; }
  .main__header{ padding:18px 20px; }
  .content-wrapper{ padding:18px 20px 40px; }
  .timeline-shell{ padding:18px 14px 22px; }
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand__mark"></div>
      <div class="brand__text"><strong>MX</strong><span>SOLUÇÕES</span></div>
    </div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab is-active" data-tab="login">Entrar</button>
      <button type="button" class="auth-tab" data-tab="signup">Criar conta</button>
    </div>
    <form id="loginForm" class="auth-form">
      <div class="field"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label for="loginPassword">Senha</label><input type="password" id="loginPassword" required></div>
      <p class="field__error" id="loginError">E-mail ou senha inválidos.</p>
      <button type="submit" class="btn btn--primary btn--full">Entrar</button>
    </form>
    <form id="signupForm" class="auth-form" style="display:none">
      <div class="field"><label for="signupName">Nome</label><input type="text" id="signupName" required></div>
      <div class="field"><label for="signupEmail">E-mail</label><input type="email" id="signupEmail" required></div>
      <div class="field"><label for="signupPassword">Senha</label><input type="password" id="signupPassword" required></div>
      <div class="field"><label for="signupPassword2">Confirmar senha</label><input type="password" id="signupPassword2" required></div>
      <p class="field__error" id="signupError">Não foi possível criar a conta.</p>
      <button type="submit" class="btn btn--primary btn--full">Criar conta</button>
    </form>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__mark"></div>
      <div class="brand__text"><strong>MX</strong><span>SOLUÇÕES</span></div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav__item is-active" data-view="hoje"><img alt=""><span>Diários de Hoje</span></button>
      <button class="nav__item" data-view="passados"><img alt=""><span>Diários Passados</span></button>
    </nav>
    <div class="sidebar__footer">
      <button class="nav__item" data-view="config"><img alt=""><span>Configurações</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="main__header">
      <div>
        <div class="main__title" id="headerTitle">—</div>
        <div class="main__subtitle" id="headerSubtitle"></div>
      </div>
      <div class="header__actions" id="headerActions"></div>
    </header>
    <div class="content-wrapper" id="mainContent"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 class="modal__title" id="modalTitle">Nova atividade</h2>
    <form id="taskForm">
      <div class="field">
        <label for="fieldTitulo">Título da atividade</label>
        <input type="text" id="fieldTitulo" placeholder="Ex.: Reunião com cliente" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fieldInicio">Horário de início</label>
          <input type="time" id="fieldInicio" required>
        </div>
        <div class="field">
          <label for="fieldFim">Horário de término</label>
          <input type="time" id="fieldFim" required>
        </div>
      </div>
      <p class="field__error" id="fieldError">O horário de término deve ser depois do início.</p>
      <div class="field">
        <label for="fieldDesc">Descrição</label>
        <textarea id="fieldDesc" placeholder="O que foi feito nesse intervalo..."></textarea>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

const HOUR_H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour-h'));
const PALETTE = [

  { bg:'#E7F7F6', line:'#0E8E86' },
  { bg:'#F4EFEA', line:'#8A5A2B' }
];

  lock: svgIcon('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#7A4E0E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'),
  lockMuted: svgIcon('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#8C8985" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'),

};

let currentUser = null;
let currentView = 'hoje';
let editingTaskId = null;
let selectedPastDate = null;
let timeOffsetMs = Number(localStorage.getItem('mx_time_offset') || 0);

function getUsers(){ return JSON.parse(localStorage.getItem('mx_users') || '[]'); }
function saveUsers(list){ localStorage.setItem('mx_users', JSON.stringify(list)); }
function getUserData(email){
  const raw = localStorage.getItem('mx_data_' + email);
  if(raw) return JSON.parse(raw);
  const fresh = { settings:{ dayStart:'08:00', dayEnd:'18:00' }, days:{} };
  localStorage.setItem('mx_data_' + email, JSON.stringify(fresh));
  return fresh;
}
function saveUserData(email, data){ localStorage.setItem('mx_data_' + email, JSON.stringify(data)); }
function getSession(){ return localStorage.getItem('mx_session'); }
function setSession(email){ localStorage.setItem('mx_session', email); }
function clearSession(){ localStorage.removeItem('mx_session'); }

function getNow(){ return new Date(Date.now() + timeOffsetMs); }
function applyTimeOffset(ms){ timeOffsetMs = ms; localStorage.setItem('mx_time_offset', String(ms)); }
function pad(n){ return String(n).padStart(2,'0'); }
function formatDateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseDateKey(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function formatLongDate(d){ return capitalize(new Intl.DateTimeFormat('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }).format(d)); }
function timeStrToMinutes(str){ const [h,m] = str.split(':').map(Number); return h*60 + m; }
function minutesToLabel(total){ return pad(Math.floor(total/60)) + ':' + pad(total%60); }
function toDatetimeLocalValue(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function syncDays(data){
  const todayKey = formatDateKey(getNow());
  let changed = false;
  Object.keys(data.days).forEach(function(key){
    if(key < todayKey && !data.days[key].closed){ data.days[key].closed = true; changed = true; }
  });
  if(!data.days[todayKey]){ data.days[todayKey] = { closed:false, tasks:[] }; changed = true; }
  if(changed) saveUserData(currentUser.email, data);
  return { todayKey: todayKey, changed: changed };
}

const authScreen = document.getElementById('authScreen');
const appRoot = document.getElementById('appRoot');
const headerTitle = document.getElementById('headerTitle');
const headerSubtitle = document.getElementById('headerSubtitle');
const headerActions = document.getElementById('headerActions');
const mainContent = document.getElementById('mainContent');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const taskForm = document.getElementById('taskForm');
const fieldTitulo = document.getElementById('fieldTitulo');
const fieldInicio = document.getElementById('fieldInicio');
const fieldFim = document.getElementById('fieldFim');

function makeButton(cls, iconSrc, label, onClick){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = cls;
  const img = document.createElement('img');
  img.src = iconSrc;
  img.alt = '';
  btn.appendChild(img);
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', onClick);
  return btn;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function buildGrid(container, dayStartMin, dayEndMin){
  container.innerHTML = '';
  for(let m = dayStartMin; m < dayEndMin; m += 60){
    const row = document.createElement('div');
    row.className = 'hour-row';
    const label = document.createElement('span');
    label.className = 'hour-row__label';
    label.textContent = minutesToLabel(m);
    row.appendChild(label);
    container.appendChild(row);
  }
  const lastLabel = document.createElement('span');
  lastLabel.className = 'hour-row__label';
  lastLabel.style.top = ((dayEndMin - dayStartMin) / 60 * HOUR_H) + 'px';
  lastLabel.textContent = minutesToLabel(dayEndMin);
  container.appendChild(lastLabel);
  container.style.height = ((dayEndMin - dayStartMin) / 60 * HOUR_H) + 'px';
  const nowLine = document.createElement('div');
  nowLine.className = 'now-line';
  container.appendChild(nowLine);
  const eventsLayer = document.createElement('div');
  eventsLayer.className = 'events-layer';
  container.appendChild(eventsLayer);
  return { nowLine: nowLine, eventsLayer: eventsLayer };
}

function layoutTasks(list){
  const sorted = list.map(function(t){ return t; }).sort(function(a,b){ return timeStrToMinutes(a.start) - timeStrToMinutes(b.start); });
  const clusters = [];
  let current = [];
  let clusterEnd = -Infinity;
  sorted.forEach(function(t){
    const s = timeStrToMinutes(t.start), e = timeStrToMinutes(t.end);
    if(s >= clusterEnd){
      if(current.length) clusters.push(current);
      current = [{ t:t, s:s, e:e }];
      clusterEnd = e;
    } else {
      current.push({ t:t, s:s, e:e });
      clusterEnd = Math.max(clusterEnd, e);
    }
  });
  if(current.length) clusters.push(current);
  const positioned = [];
  clusters.forEach(function(cluster){
    const colEnds = [];
    cluster.forEach(function(item){
      let placedCol = -1;
      for(let c=0; c<colEnds.length; c++){
        if(colEnds[c] <= item.s){ placedCol = c; colEnds[c] = item.e; break; }
      }
      if(placedCol === -1){ placedCol = colEnds.length; colEnds.push(item.e); }
      item.col = placedCol;
    });
    cluster.forEach(function(item){ item.totalCols = colEnds.length; positioned.push(item); });
  });
  return positioned;
}

function renderTasksInto(eventsLayer, tasks, dayStartMin, readOnly){
  eventsLayer.innerHTML = '';
  const positioned = layoutTasks(tasks);
  positioned.forEach(function(entry){
    const t = entry.t, s = entry.s, e = entry.e, col = entry.col, totalCols = entry.totalCols;
    const top = (s - dayStartMin) / 60 * HOUR_H;
    const height = Math.max((e - s) / 60 * HOUR_H, 26);
    const gap = 6;
    const widthPct = 100 / totalCols;
    const leftPct = widthPct * col;
    const block = document.createElement('div');
    block.className = 'event-block' + (readOnly ? '' : ' is-editable');
    block.style.top = top + 'px';
    block.style.height = height + 'px';
    block.style.left = 'calc(' + leftPct + '% + ' + (col === 0 ? 0 : gap/2) + 'px)';
    block.style.width = 'calc(' + widthPct + '% - ' + gap + 'px)';
    block.style.setProperty('--ev-bg', t.color.bg);
    block.style.setProperty('--ev-line', t.color.line);
    block.innerHTML =
      '<div class="event-block__time">' + t.start + ' – ' + t.end + '</div>' +
      '<div class="event-block__title">' + escapeHtml(t.title) + '</div>' +
      '<div class="event-block__desc">' + escapeHtml(t.description) + '</div>';
    if(readOnly){
      const lock = document.createElement('div');
      lock.className = 'event-block__lock';
      lock.innerHTML = '<img src="' + ICONS.lockMuted + '" alt="">';
      block.appendChild(lock);
    } else {
      const del = document.createElement('button');
      del.className = 'event-block__delete';
      del.type = 'button';
      del.innerHTML = '<img src="' + ICONS.close + '" alt="">';
      del.addEventListener('click', function(ev){ ev.stopPropagation(); removeTask(t.id); });
      block.appendChild(del);
      block.addEventListener('click', function(){ openTaskModal(t); });
    }
    eventsLayer.appendChild(block);
  });
}

function positionNowLine(nowLine, dayStartMin, dayEndMin){
  const now = getNow();
  const mins = now.getHours()*60 + now.getMinutes();
  if(mins < dayStartMin || mins > dayEndMin){ nowLine.style.display = 'none'; return; }
  nowLine.style.display = 'block';
  nowLine.style.top = ((mins - dayStartMin) / 60 * HOUR_H) + 'px';
}

function timelineShellHtml(closed, bannerText){
  return '<div class="timeline-shell">' +
    (closed ? '<div class="locked-banner"><img src="' + ICONS.lock + '" alt="">' + bannerText + '</div>' : '') +
    '<div class="timeline-grid" id="timelineGrid"></div>' +
    '<p class="empty-state" id="emptyState">Nenhuma atividade registrada.</p>' +
    '</div>';
}

function renderHojeView(){
  const data = getUserData(currentUser.email);
  const sync = syncDays(data);
  const day = data.days[sync.todayKey];
  const startMin = timeStrToMinutes(data.settings.dayStart);
  const endMin = timeStrToMinutes(data.settings.dayEnd);

  headerTitle.textContent = formatLongDate(getNow());
  headerSubtitle.textContent = data.settings.dayStart + ' – ' + data.settings.dayEnd;
  headerActions.innerHTML = '';
  if(!day.closed){
    headerActions.appendChild(makeButton('btn btn--accent', ICONS.plus, 'Criar', function(){ openTaskModal(null); }));
    headerActions.appendChild(makeButton('btn btn--ghost', ICONS.lock, 'Encerrar dia', function(){ closeDayManually(sync.todayKey); }));
  }
  headerActions.appendChild(makeButton('btn btn--ghost', ICONS.download, 'Exportar PDF', function(){ exportPDF(sync.todayKey); }));

  mainContent.innerHTML = timelineShellHtml(day.closed, 'Este diário foi encerrado e não pode mais ser alterado.');
  const gridEl = document.getElementById('timelineGrid');
  const built = buildGrid(gridEl, startMin, endMin);
  renderTasksInto(built.eventsLayer, day.tasks, startMin, day.closed);
  if(day.closed){ built.nowLine.style.display = 'none'; } else { positionNowLine(built.nowLine, startMin, endMin); }
  document.getElementById('emptyState').style.display = day.tasks.length ? 'none' : 'block';
}

function renderPassadosView(){
  const data = getUserData(currentUser.email);
  syncDays(data);
  const closedDays = Object.keys(data.days).filter(function(k){ return data.days[k].closed; }).sort().reverse();

  if(!selectedPastDate || closedDays.indexOf(selectedPastDate) === -1){
    headerTitle.textContent = 'Diários Passados';
    headerSubtitle.textContent = closedDays.length + ' dia(s) encerrado(s)';
    headerActions.innerHTML = '';
    if(!closedDays.length){
      mainContent.innerHTML = '<div class="placeholder">Nenhum diário encerrado ainda.</div>';
      return;
    }
    mainContent.innerHTML = '<div class="day-list" id="dayList"></div>';
    const list = document.getElementById('dayList');
    closedDays.forEach(function(key){
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'day-list__item';
      item.textContent = formatLongDate(parseDateKey(key)) + ' · ' + data.days[key].tasks.length + ' atividade(s)';
      item.addEventListener('click', function(){ selectedPastDate = key; render(); });
      list.appendChild(item);
    });
    return;
  }

  const day = data.days[selectedPastDate];
  const startMin = timeStrToMinutes(data.settings.dayStart);
  const endMin = timeStrToMinutes(data.settings.dayEnd);
  headerTitle.textContent = formatLongDate(parseDateKey(selectedPastDate));
  headerSubtitle.textContent = 'Diário encerrado';
  headerActions.innerHTML = '';
  headerActions.appendChild(makeButton('btn btn--ghost', ICONS.back, 'Voltar', function(){ selectedPastDate = null; render(); }));
  headerActions.appendChild(makeButton('btn btn--ghost', ICONS.download, 'Exportar PDF', function(){ exportPDF(selectedPastDate); }));

  mainContent.innerHTML = timelineShellHtml(true, 'Diário encerrado — somente visualização.');
  const gridEl = document.getElementById('timelineGrid');
  const built = buildGrid(gridEl, startMin, endMin);
  built.nowLine.style.display = 'none';
  renderTasksInto(built.eventsLayer, day.tasks, startMin, true);
  document.getElementById('emptyState').style.display = day.tasks.length ? 'none' : 'block';
}

let clockTimer = null;

function renderConfigView(){
  const data = getUserData(currentUser.email);
  headerTitle.textContent = 'Configurações';
  headerSubtitle.textContent = currentUser.email;
  headerActions.innerHTML = '';

  mainContent.innerHTML =
    '<div class="config-grid">' +
      '<div class="config-card">' +
        '<h3>Horário do expediente</h3>' +
        '<p class="hint">Define o intervalo exibido na linha do tempo diária.</p>' +
        '<form id="scheduleForm">' +
          '<div class="field-row">' +
            '<div class="field"><label for="cfgStart">Início</label><input type="time" id="cfgStart" value="' + data.settings.dayStart + '" required></div>' +
            '<div class="field"><label for="cfgEnd">Fim</label><input type="time" id="cfgEnd" value="' + data.settings.dayEnd + '" required></div>' +
          '</div>' +
          '<p class="field__error" id="scheduleError">O horário final deve ser depois do inicial.</p>' +
          '<div class="config-actions"><button type="submit" class="btn btn--primary">Salvar horário</button></div>' +
        '</form>' +
      '</div>' +
      '<div class="config-card">' +
        '<h3>Alterar senha</h3>' +
        '<p class="hint">Confirme a senha atual para definir uma nova.</p>' +
        '<form id="passwordForm">' +
          '<div class="field"><label for="cfgCurrentPass">Senha atual</label><input type="password" id="cfgCurrentPass" required></div>' +
          '<div class="field"><label for="cfgNewPass">Nova senha</label><input type="password" id="cfgNewPass" required></div>' +
          '<div class="field"><label for="cfgNewPass2">Confirmar nova senha</label><input type="password" id="cfgNewPass2" required></div>' +
          '<p class="field__error" id="passwordError">Não foi possível alterar a senha.</p>' +
          '<p class="field__error" id="passwordSuccess" style="color:#1F9254">Senha alterada com sucesso.</p>' +
          '<div class="config-actions"><button type="submit" class="btn btn--primary">Alterar senha</button></div>' +
        '</form>' +
      '</div>' +
      '<div class="config-card">' +
        '<h3>Simular horário (testes)</h3>' +
        '<p class="hint">Ajuste o relógio do sistema para testar o encerramento automático à meia-noite.</p>' +
        '<div class="clock-readout" id="cfgClock"></div>' +
        '<div class="field"><label for="cfgSimDate">Data e hora simuladas</label><input type="datetime-local" id="cfgSimDate" value="' + toDatetimeLocalValue(getNow()) + '"></div>' +
        '<div class="config-actions">' +
          '<button type="button" class="btn btn--ghost" id="cfgSimReset">Usar horário real</button>' +
          '<button type="button" class="btn btn--primary" id="cfgSimApply">Aplicar</button>' +
        '</div>' +
      '</div>' +
      '<div class="config-card">' +
        '<h3>Sessão</h3>' +
        '<p class="hint">Conectado como ' + escapeHtml(currentUser.name) + '.</p>' +
        '<button type="button" class="btn btn--danger" id="logoutBtn">' +
          '<img src="' + ICONS.logout + '" alt="">Sair da conta' +
        '</button>' +
      '</div>' +
    '</div>';

  document.getElementById('scheduleForm').addEventListener('submit', function(e){
    e.preventDefault();
    const start = document.getElementById('cfgStart').value;
    const end = document.getElementById('cfgEnd').value;
    if(timeStrToMinutes(end) <= timeStrToMinutes(start)){
      document.getElementById('scheduleError').classList.add('is-visible');
      return;
    }
    const d = getUserData(currentUser.email);
    d.settings.dayStart = start;
    d.settings.dayEnd = end;
    saveUserData(currentUser.email, d);
    render();
  });

  document.getElementById('passwordForm').addEventListener('submit', function(e){
    e.preventDefault();
    const current = document.getElementById('cfgCurrentPass').value;
    const next = document.getElementById('cfgNewPass').value;
    const next2 = document.getElementById('cfgNewPass2').value;
    const errEl = document.getElementById('passwordError');
    const okEl = document.getElementById('passwordSuccess');
    errEl.classList.remove('is-visible');
    okEl.classList.remove('is-visible');
    const users = getUsers();
    const user = users.find(function(u){ return u.email === currentUser.email; });
    if(!user || user.password !== current){
      errEl.textContent = 'Senha atual incorreta.';
      errEl.classList.add('is-visible');
      return;
    }
    if(next.length < 4){
      errEl.textContent = 'A nova senha deve ter ao menos 4 caracteres.';
      errEl.classList.add('is-visible');
      return;
    }
    if(next !== next2){
      errEl.textContent = 'A confirmação não corresponde à nova senha.';
      errEl.classList.add('is-visible');
      return;
    }
    user.password = next;
    saveUsers(users);
    okEl.classList.add('is-visible');
    e.target.reset();
  });

  document.getElementById('cfgSimApply').addEventListener('click', function(){
    const val = document.getElementById('cfgSimDate').value;
    if(!val) return;
    const chosen = new Date(val);
    applyTimeOffset(chosen.getTime() - Date.now());
    render();
  });
  document.getElementById('cfgSimReset').addEventListener('click', function(){
    applyTimeOffset(0);
    render();
  });
  document.getElementById('logoutBtn').addEventListener('click', function(){
    clearSession();
    currentUser = null;
    selectedPastDate = null;
    currentView = 'hoje';
    render();
  });

  if(clockTimer) clearInterval(clockTimer);
  const clockEl = document.getElementById('cfgClock');
  function tickClock(){
    clockEl.textContent = new Intl.DateTimeFormat('pt-BR', { dateStyle:'short', timeStyle:'medium' }).format(getNow());
  }
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}

function render(){
  if(!currentUser){
    authScreen.style.display = 'flex';
    appRoot.style.display = 'none';
    if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
    return;
  }
  authScreen.style.display = 'none';
  appRoot.style.display = 'flex';
  if(currentView !== 'config' && clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  document.querySelectorAll('.nav__item').forEach(function(btn){
    btn.classList.toggle('is-active', btn.getAttribute('data-view') === currentView);
  });
  if(currentView === 'hoje') renderHojeView();
  else if(currentView === 'passados') renderPassadosView();
  else renderConfigView();
}

function openTaskModal(task){
  taskForm.reset();
  fieldError.classList.remove('is-visible');
  if(task){
    editingTaskId = task.id;
    modalTitle.textContent = 'Editar atividade';
    fieldTitulo.value = task.title;
    fieldInicio.value = task.start;
    fieldFim.value = task.end;
    fieldDesc.value = task.description;
  } else {
    editingTaskId = null;
    modalTitle.textContent = 'Nova atividade';
    fieldInicio.value = '09:00';
    fieldFim.value = '10:00';
  }
  modalOverlay.classList.add('is-open');
  fieldTitulo.focus();
}
function closeModal(){ modalOverlay.classList.remove('is-open'); }

document.getElementById('btnCancelar').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modalOverlay.classList.contains('is-open')) closeModal(); });

taskForm.addEventListener('submit', function(e){
  e.preventDefault();
  const start = fieldInicio.value;
  const end = fieldFim.value;
  if(timeStrToMinutes(end) <= timeStrToMinutes(start)){
    fieldError.classList.add('is-visible');
    return;
  }
  fieldError.classList.remove('is-visible');
  const data = getUserData(currentUser.email);
  const sync = syncDays(data);
  const day = data.days[sync.todayKey];
  if(day.closed){ closeModal(); render(); return; }
  if(editingTaskId){
    const task = day.tasks.find(function(t){ return t.id === editingTaskId; });
    if(task){
      task.title = fieldTitulo.value.trim() || 'Sem título';
      task.start = start;
      task.end = end;
      task.description = fieldDesc.value.trim();
    }
  } else {
    day.tasks.push({
      id: Date.now(),
      title: fieldTitulo.value.trim() || 'Sem título',
      start: start,
      end: end,
      description: fieldDesc.value.trim(),
      color: PALETTE[day.tasks.length % PALETTE.length]
    });
  }
  saveUserData(currentUser.email, data);
  closeModal();
  render();
});

function removeTask(id){
  const data = getUserData(currentUser.email);
  const sync = syncDays(data);
  const day = data.days[sync.todayKey];
  if(day.closed) return;
  day.tasks = day.tasks.filter(function(t){ return t.id !== id; });
  saveUserData(currentUser.email, data);
  render();
}

function closeDayManually(dateKey){
  if(!window.confirm('Encerrar o diário de hoje? Depois disso não será mais possível editar as atividades.')) return;
  const data = getUserData(currentUser.email);
  data.days[dateKey].closed = true;
  saveUserData(currentUser.email, data);
  render();
}

function exportPDF(dateKey){
  const data = getUserData(currentUser.email);
  const day = data.days[dateKey];
  if(!day || !day.tasks.length){
    window.alert('Nenhuma atividade registrada para exportar.');
    return;
  }
  const jsPDFRef = window.jspdf.jsPDF;
  const doc = new jsPDFRef({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 48;
  let y = 56;

  doc.setFillColor(242, 167, 59);
  doc.rect(0, 0, pageW, 6, 'F');

  doc.setFont(undefined, 'bold');
  doc.setFontSize(18);
  doc.setTextColor(28, 27, 26);
  doc.text('MX SOLUÇÕES', marginX, y);

  y += 20;
  doc.setFont(undefined, 'normal');
  doc.setFontSize(11);
  doc.setTextColor(140, 137, 133);
  doc.text('Diário de Bordo — Relatório de Atividades', marginX, y);

  y += 16;
  doc.setFontSize(10.5);
  doc.text(formatLongDate(parseDateKey(dateKey)), marginX, y);

  y += 14;
  doc.setDrawColor(231, 228, 223);
  doc.line(marginX, y, pageW - marginX, y);
  y += 26;

  const sorted = day.tasks.slice().sort(function(a,b){ return timeStrToMinutes(a.start) - timeStrToMinutes(b.start); });
  const pageBottom = 780;

  sorted.forEach(function(t){
    if(y > pageBottom - 60){ doc.addPage(); y = 56; }
    doc.setFont(undefined, 'bold');
    doc.setFontSize(11);
    doc.setTextColor(201, 130, 27);
    doc.text(t.start + ' – ' + t.end, marginX, y);
    doc.setTextColor(28, 27, 26);
    doc.text(t.title, marginX + 78, y);
    y += 15;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(10);
    doc.setTextColor(81, 79, 76);
    const desc = t.description && t.description.length ? t.description : '—';
    const lines = doc.splitTextToSize(desc, pageW - marginX*2 - 12);
    lines.forEach(function(line){
      if(y > pageBottom){ doc.addPage(); y = 56; }
      doc.text(line, marginX + 12, y);
      y += 13;
    });
    y += 10;
    doc.setDrawColor(231, 228, 223);
    doc.line(marginX, y, pageW - marginX, y);
    y += 20;
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setFont(undefined, 'normal');
    doc.setFontSize(8.5);
    doc.setTextColor(140, 137, 133);
    doc.text('Página ' + p + ' de ' + totalPages, pageW - marginX - 60, 820);
  }

  doc.save('diario-de-bordo-mx-' + dateKey + '.pdf');
}

let tickTimer = null;
function tick(){
  if(!currentUser) return;
  const data = getUserData(currentUser.email);
  const sync = syncDays(data);
  if(sync.changed){ render(); return; }
  if(currentView === 'hoje'){
    const grid = document.getElementById('timelineGrid');
    const nowLine = grid ? grid.querySelector('.now-line') : null;
    const day = data.days[sync.todayKey];
    if(nowLine && !day.closed){
      positionNowLine(nowLine, timeStrToMinutes(data.settings.dayStart), timeStrToMinutes(data.settings.dayEnd));
    }
  }
}

document.querySelectorAll('.auth-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.auth-tab').forEach(function(t){ t.classList.remove('is-active'); });
    tab.classList.add('is-active');
    const target = tab.getAttribute('data-tab');
    document.getElementById('loginForm').style.display = target === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = target === 'signup' ? 'block' : 'none';
  });
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const user = getUsers().find(function(u){ return u.email === email && u.password === password; });
  if(!user){
    errEl.classList.add('is-visible');
    return;
  }
  errEl.classList.remove('is-visible');
  currentUser = user;
  setSession(user.email);
  currentView = 'hoje';
  render();
});

document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const password = document.getElementById('signupPassword').value;
  const password2 = document.getElementById('signupPassword2').value;
  const errEl = document.getElementById('signupError');
  const users = getUsers();
  if(users.some(function(u){ return u.email === email; })){
    errEl.textContent = 'Já existe uma conta com este e-mail.';
    errEl.classList.add('is-visible');
    return;
  }
  if(password.length < 4){
    errEl.textContent = 'A senha deve ter ao menos 4 caracteres.';
    errEl.classList.add('is-visible');
    return;
  }
  if(password !== password2){
    errEl.textContent = 'As senhas não coincidem.';
    errEl.classList.add('is-visible');
    return;
  }
  errEl.classList.remove('is-visible');
  const user = { name: name || email, email: email, password: password };
  users.push(user);
  saveUsers(users);
  getUserData(email);
  currentUser = user;
  setSession(user.email);
  currentView = 'hoje';
  render();
});

document.querySelectorAll('#mainNav .nav__item, .sidebar__footer .nav__item').forEach(function(btn){
  btn.addEventListener('click', function(){
    currentView = btn.getAttribute('data-view');
    if(currentView !== 'passados') selectedPastDate = null;
    render();
  });
});

document.querySelectorAll('.nav__item img').forEach(function(img){
  const view = img.closest('.nav__item').getAttribute('data-view');
  if(view === 'hoje') img.src = ICONS.doc;
  else if(view === 'passados') img.src = ICONS.archive;
  else img.src = ICONS.gear;
});

const sessionEmail = getSession();
if(sessionEmail){
  const found = getUsers().find(function(u){ return u.email === sessionEmail; });
  if(found) currentUser = found;
}
render();
tickTimer = setInterval(tick, 5000);

})();
</script>
</body>
</html>
